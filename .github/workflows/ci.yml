name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 3 OS matrix（todo b7fe931ffa、2026-09-27）。qsoku本体のWindows/
  # PowerShell対応（人間から確認済み）を受けて、ubuntu-latest固定から拡張
  # した。mtqg本体のci.yml（check jobの3 OS matrix、goモジュールキャッシュの
  # github.com/amisonnet8/mtqg@v0.4.0で実物を確認）に倣う。
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      # cache: false -- setup-go's own caching keys off go.mod/go.sum, which
      # this repo (TypeScript, not a Go module) has neither of. Without this,
      # every job prints a harmless but noisy "Restore cache failed" warning.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      - name: Install npm dependencies
        run: npm ci
      # qsoku: build/unit/test/trivy/shellcheckの入口（qsokufile、
      # .claude/rules/testing.md）。@latestはこのリポジトリのdevcontainer
      # （.devcontainer/postCreate.sh）と同じ選択（qsoku自身がまだ動きの速い
      # 段階のため。mtqg本体のci.ymlも同じ）
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@latest
      # v1.0.0はこの拡張が前提とする最低版（src/mtqg/availability.tsの
      # MIN_SUPPORTED_MTQG_VERSION）に合わせている。上げたら両方揃える
      # （.devcontainer/postCreate.shのmtqgは@latestで別枠、.claude/rules/mtqg-cli.md「版」）
      - name: Install mtqg
        run: go install github.com/amisonnet8/mtqg/cmd/mtqg@v1.0.0
      # xvfb一式：qsoku test（拡張開発ホストで実物VS Codeを起動する。
      # .claude/rules/testing.md）に必要。.devcontainer/postCreate.shと同じ
      # パッケージ一覧（動作確認済みの組み合わせ）がベースだが、`ubuntu-latest`
      # はUbuntu 24.04（noble）で、`libasound2`が仮想パッケージになり実体が
      # `libasound2t64`に変わっている（devcontainer側はDebian bookwormなので
      # `libasound2`のまま。実機のCIログで確認、2026-09-27：
      # "Package 'libasound2' has no installation candidate"）。
      # macos-latest/windows-latestは元から実ディスプレイを持つランナーで
      # Xvfbが要らない上、apt-getも無いのでLinuxだけに絞る（qsokufileの
      # test:エントリもxvfb-runの有無で同じ判定をしている）。
      - name: Install headless VS Code dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgtk-3-0 libasound2t64 libgbm1 libxkbfile1 libsecret-1-0 libxss1
      # shell: bashはmtqg本体のci.ymlと同じ（Linux/macOSは元から既定がbashで
      # 無害、Windowsは既定のpwshではなくGit Bashを使わせる）。
      - name: qsoku check
        shell: bash
        run: qsoku check
      - name: qsoku test
        shell: bash
        run: qsoku test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@latest
      - name: qsoku shellcheck
        run: qsoku shellcheck

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      - name: Install qsoku
        run: go install github.com/amisonnet8/qsoku/cmd/qsoku@latest
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.71.2
      - name: qsoku trivy
        run: qsoku trivy
