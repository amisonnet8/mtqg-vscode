<!--
  Same mark as tab-icon-light.svg (see that file's comment for provenance:
  the four-color tile grid from mtqg's own logo, docs/assets/logo.svg in
  amisonnet8/mtqg, with the letters/text dropped for legibility at 16px).
  The colors are fixed brand colors, not theme-dependent, so this file is
  identical to the light variant -- kept as a separate file only because
  WebviewPanel.iconPath and package.json's command icon both require a
  {light, dark} pair.
-->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <rect x="0.8" y="0.8" width="7.2" height="7.2" rx="1.4" fill="#1F6FEB"/>
  <rect x="9.6" y="0.8" width="7.2" height="7.2" rx="1.4" fill="#1F883D"/>
  <rect x="0.8" y="9.6" width="7.2" height="7.2" rx="1.4" fill="#8250DF"/>
  <rect x="9.6" y="9.6" width="7.2" height="7.2" rx="1.4" fill="#BC4C00"/>
</svg>
