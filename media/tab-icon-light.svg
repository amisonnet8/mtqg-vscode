<!--
  Derived from mtqg's own logo (docs/assets/logo.svg,
  https://github.com/amisonnet8/mtqg/blob/main/docs/assets/logo.svg, v1,
  2026-09-28). That logo is a 560x200 wordmark meant as a README banner
  ("mtqg" heading + four colored letter tiles + captions); at a tab-icon
  size (16px) the heading/captions are illegible and the per-tile letters
  (m/t/q/g) blur into noise (checked by rendering both at 16/24/32px before
  choosing). This file keeps only the four-color tile grid itself, without
  letters or text -- legible at 16px and consistent with ui.md's "文字にあまり
  頼らないUIにする" (rely on shape/color, not text, for identity at this
  size). Colors match the logo's own fixed rect fills, so the same file
  works for both the light and dark variant (unlike the previous Codicon
  book glyph, which needed a different flat color per theme).
-->
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <rect x="0.8" y="0.8" width="7.2" height="7.2" rx="1.4" fill="#1F6FEB"/>
  <rect x="9.6" y="0.8" width="7.2" height="7.2" rx="1.4" fill="#1F883D"/>
  <rect x="0.8" y="9.6" width="7.2" height="7.2" rx="1.4" fill="#8250DF"/>
  <rect x="9.6" y="9.6" width="7.2" height="7.2" rx="1.4" fill="#BC4C00"/>
</svg>
